<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chickenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc3300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Plate -->
  <ellipse cx="150" cy="160" rx="120" ry="25" fill="url(#plateGradient)" stroke="#ccc" stroke-width="2"/>

  <!-- Chicken pieces -->
  <ellipse cx="120" cy="130" rx="25" ry="18" fill="url(#chickenGradient)" transform="rotate(-15 120 130)"/>
  <ellipse cx="150" cy="120" rx="28" ry="20" fill="url(#chickenGradient)" transform="rotate(10 150 120)"/>
  <ellipse cx="180" cy="135" rx="22" ry="16" fill="url(#chickenGradient)" transform="rotate(-20 180 135)"/>

  <!-- Spices/Masala dots -->
  <circle cx="125" cy="125" r="2" fill="#8b4513"/>
  <circle cx="155" cy="115" r="2" fill="#8b4513"/>
  <circle cx="175" cy="130" r="2" fill="#8b4513"/>
  <circle cx="135" cy="140" r="2" fill="#8b4513"/>
  <circle cx="165" cy="125" r="2" fill="#8b4513"/>

  <!-- Lemon wedges -->
  <ellipse cx="110" cy="110" rx="8" ry="5" fill="#ffd700" transform="rotate(45 110 110)"/>
  <ellipse cx="190" cy="115" rx="8" ry="5" fill="#ffd700" transform="rotate(30 190 115)"/>

  <!-- Onion rings -->
  <ellipse cx="100" cy="150" rx="6" ry="3" fill="#fff" stroke="#ffa500" stroke-width="1"/>
  <ellipse cx="200" cy="145" rx="6" ry="3" fill="#fff" stroke="#ffa500" stroke-width="1"/>
</svg></content>
