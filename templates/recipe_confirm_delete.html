{% extends 'base.html' %}
{% block content %}
    <h2>Delete recipe: {{ recipe.title }}</h2>
    <p>Are you sure you want to delete this recipe? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{{ recipe.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
