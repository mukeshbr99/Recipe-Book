{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 78vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 420px; background: rgba(7, 9, 19, 0.87); border: 1px solid rgba(255,255,255,0.16);">
        <div class="card-body p-4">
            <h2 class="card-title text-center mb-4" style="color: #ff6f61;">Create your account</h2>
            <p class="text-center text-muted mb-4">Join the Recipe Hub – share and discover awesome dishes.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ field.id_for_label }}" style="color: #e8e8f5;">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-control bg-dark text-white border-0" {% if field.value %}value="{{ field.value }}"{% endif %} />
                        <div class="text-danger" style="font-size: 0.875rem;">{{ field.errors }}</div>
                    </div>
                {% endfor %}
                <button class="btn btn-lg btn-block" type="submit" style="background: #ff6f61; color:#fff; width:100%;">Register</button>
            </form>
            <p class="mt-3 text-center text-muted">Already have an account? <a href="{% url 'login' %}" class="text-warning">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
